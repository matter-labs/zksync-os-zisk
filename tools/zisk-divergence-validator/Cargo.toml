[package]
name = "zisk-divergence-validator"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# The crate is its own workspace. It is the one place where native ZKsync OS
# and the ZiSK guest lib resolve together, and the `production` feature plus
# the zksync-os nightly toolchain must not reach the shipping crates.
[workspace]

[[bin]]
name = "zisk-divergence-validator"
path = "src/main.rs"

[dependencies]
zksync-os-zisk-lib = { path = "../../lib" }
zksync-os-zisk-test-utils = { path = "../test-utils" }

# Native ZKsync OS at the release the committed EEST corpus pins as its native
# producer (see tools/CORPUS.md and tools/eest-corpus/manifest.json).
rig = { git = "https://github.com/matter-labs/zksync-os", tag = "v0.5.4-private", features = [
    "no_print",
] }
forward_system = { git = "https://github.com/matter-labs/zksync-os", tag = "v0.5.4-private", features = [
    "production",
] }
zksync_os_tests_common = { git = "https://github.com/matter-labs/zksync-os", tag = "v0.5.4-private" }

alloy = { version = "2.4.1", features = [
    "consensus",
    "dyn-abi",
    "json-abi",
    "network",
    "signers",
    "signer-local",
    "sol-types",
] }
ruint = { version = "1.20", features = ["alloc"] }
anyhow = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
sha2 = "0.10"
# The self-check reads one case out of a committed corpus shard.
tar = "0.4"
zstd = "0.13"

# The Airbender dependency graph the native crates pull in fails to compile
# debug-info-heavy host builds on this toolchain; zksync-os pins the same
# setting in its own workspace.
[profile.dev]
debug = false

[profile.test]
debug = false
