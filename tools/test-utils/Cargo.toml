[package]
name = "zksync-os-zisk-test-utils"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# Test utilities for the ZiSK lane, kept out of the shippable crates:
# dump_to_batchinput feeds the EEST corpus lane (tools/corpus-emu.sh) and
# run_batch_input replays a captured BatchInput for divergence debugging.

[dependencies]
zksync-os-zisk-lib = { path = "../../lib" }
zksync-os-revm = { git = "https://github.com/antoniolocascio-bot/zksync-os-revm", branch = "dev", default-features = false }
revm = { version = "=38.0.0", default-features = false, features = ["std", "optional_balance_check", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alloy-primitives = { version = "1", default-features = false }
anyhow = "1"
