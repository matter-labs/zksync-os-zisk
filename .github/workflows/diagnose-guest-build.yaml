name: Diagnose alpha guest rebuild
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild without updating any published artifacts
        run: ./build-guest.sh --record
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-guest-elf
          path: out/zksync-os-zisk-guest
          retention-days: 3
