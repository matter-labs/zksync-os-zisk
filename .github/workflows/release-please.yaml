name: Release-please

# Maintains the release PR from conventional commits on main and publishes the GitHub release when it merges.

# A reusable workflow cannot elevate GITHUB_TOKEN, so the caller grants what
# the shared workflow's jobs may use.
permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write
  issues: write # release-please labels

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Run release-please for every commit, in order.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: matter-labs/zksync-ci-common/.github/workflows/release-please.yaml@861e435968531a7699cb7f644107f89a2b7734e0 # main
    secrets:
      # Org-level secrets of the GitHub App used to mint installation tokens.
      # API commits are auto-signed, which `main` requires, and the App token's
      # published release fires release-assets.
      MATTERLABS_BOTS_APP_ID: ${{ secrets.MATTERLABS_BOTS_APP_ID }}
      MATTERLABS_BOTS_PRIVATE_KEY: ${{ secrets.MATTERLABS_BOTS_PRIVATE_KEY }}
    with:
      config: '.github/release-please/config.json'
      manifest: '.github/release-please/manifest.json'
      # A release PR touches only CHANGELOG.md and the manifest, and the
      # repository root holds no Cargo workspace for `cargo update` to run in.
      update-cargo-lock: 'false'
      # No release webhook is shared with this repository.
      notify-slack: 'false'
