name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  ZKSYNC_USE_CUDA_STUBS: "1"

# The lib/, guest/ and guest-aggregator/ sources are byte-frozen inputs of
# the reproducible guest builds: the recorded ELF hashes and the programVKs
# pinned on L1 derive from those exact bytes. Formatting and lint fixes in
# those trees land together with an intentional VK rotation; until then CI
# checks them with the known lint set allowed. The prover crate and the
# zisk-verifier crate are not part of any guest ELF. CI holds them to the
# strict bar. Proving itself (GPU keys, ~41 GB setup) and target emulation of
# the full EEST corpus run outside CI; the committed corpus replays natively.
jobs:
  release-automation:
    name: release automation (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B -m unittest discover -s .github/scripts/tests -v
      - run: bash -n .github/scripts/derive-vk.sh
      # The ZiSK stack scripts and compose file ship in the worker image and
      # drive the GPU deployment; keep them syntactically valid.
      - run: bash -n docker/zisk-stack/prepare-keys.sh docker/zisk-stack/build-images.sh
      - run: >
          docker compose -f docker/zisk-stack/compose.yaml
          --env-file docker/zisk-stack/.env.example config --quiet

  prover:
    name: prover (fmt, clippy, tests, deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: prover
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.9
      # proofman-verifier 1.2.0-alpha depends, unconditionally on x86_64, on
      # proofman-starks-lib-c, which compiles the pil2-stark C++ library while
      # cargo builds. These packages are that build's inputs (nasm for the
      # bn128 assembly, nlohmann-json, gmp, sodium, OpenMP, MPI). rust-cache keeps
      # the compiled library across runs.
      - run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          build-essential cmake nasm libgmp-dev nlohmann-json3-dev libsodium-dev
          libomp-dev libopenmpi-dev openmpi-bin openmpi-common libssl-dev
          uuid-dev libsecp256k1-dev libpqxx-dev libprotobuf-dev
          protobuf-compiler libgrpc++-dev
      - run: cargo fmt --check
        working-directory: prover
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: prover
      - run: cargo test
        working-directory: prover
      - run: cargo deny --log-level error check --config ../deny.toml licenses advisories sources
        working-directory: prover

  lib:
    name: lib (clippy, tests, deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lib
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.9
      # int_plus_one and iter_cloned_collect are new clippy nits. int_plus_one
      # is in the byte-frozen production source (executor block-hash window);
      # its suggested rewrite is not equivalent at last_block_number 0, so the
      # code stays as is until the next VK rotation. Both join the allowed set.
      - run: >
          cargo clippy --all-targets -- -D warnings
          -A unexpected_cfgs
          -A clippy::doc_lazy_continuation
          -A clippy::int_plus_one
          -A clippy::iter_cloned_collect
          -A clippy::manual_div_ceil
          -A clippy::manual_is_multiple_of
          -A clippy::manual_repeat_n
          -A clippy::needless_borrow
          -A clippy::needless_range_loop
          -A clippy::type_complexity
          -A clippy::unnecessary_sort_by
        working-directory: lib
      - run: cargo test
        working-directory: lib
      - run: cargo deny --log-level error check --config ../deny.toml licenses advisories sources
        working-directory: lib

  guest-aggregator:
    name: guest-aggregator (clippy, tests, deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: guest-aggregator
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.9
      # chunks_exact_to_as_chunks is a new clippy 1.98 nit. Three of its hits
      # are in the byte-frozen production source (the widen/pack helpers and
      # the binding-digest assembly), so the rewrite waits for the next VK
      # rotation. It joins the allowed set.
      - run: >
          cargo clippy --all-targets -- -D warnings
          -A unexpected_cfgs
          -A clippy::chunks_exact_to_as_chunks
        working-directory: guest-aggregator
      - run: cargo test
        working-directory: guest-aggregator
      - run: cargo deny --log-level error check --config ../deny.toml licenses advisories sources
        working-directory: guest-aggregator

  zisk-verifier:
    name: zisk-verifier (fmt, clippy, tests, deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zisk-verifier
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.9
      # The zisk-verifier crate is a host-side server crate. It is not an input
      # of the reproducible guest builds, so CI holds it to the strict bar. The
      # --all-features run also builds the stark-native path (proofman-verifier)
      # and runs the real-fixture vadcop_final STARK test.
      # proofman-verifier 1.2.0-alpha depends, unconditionally on x86_64, on
      # proofman-starks-lib-c, which compiles the pil2-stark C++ library while
      # cargo builds. These packages are that build's inputs (nasm for the
      # bn128 assembly, nlohmann-json, gmp, sodium, OpenMP, MPI). rust-cache keeps
      # the compiled library across runs.
      - run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          build-essential cmake nasm libgmp-dev nlohmann-json3-dev libsodium-dev
          libomp-dev libopenmpi-dev openmpi-bin openmpi-common libssl-dev
          uuid-dev libsecp256k1-dev libpqxx-dev libprotobuf-dev
          protobuf-compiler libgrpc++-dev
      - run: cargo fmt --check
        working-directory: zisk-verifier
      - run: cargo clippy --all-targets --all-features -- -D warnings -A unexpected_cfgs
        working-directory: zisk-verifier
      - run: cargo test --all-features
        working-directory: zisk-verifier
      - run: cargo deny --log-level error check --config ../deny.toml licenses advisories sources
        working-directory: zisk-verifier

  test-utils:
    name: test-utils (fmt, clippy, tests, deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/test-utils
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.9
      - run: cargo fmt --check
        working-directory: tools/test-utils
      - run: cargo clippy --all-targets -- -D warnings -A unexpected_cfgs
        working-directory: tools/test-utils
      - run: cargo test
        working-directory: tools/test-utils
      - run: cargo deny --log-level error check --config ../../deny.toml licenses advisories sources
        working-directory: tools/test-utils

  eest-native:
    name: committed EEST corpus (native)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/test-utils
      - name: install corpus decompressor
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: build the native corpus reader
        run: cargo build --release --bin dump_to_batchinput
        working-directory: tools/test-utils
      # Each committed dump includes its witness and native ZKsync OS
      # commitments. The candidate branch reconstructs and executes it here.
      - name: replay every committed EEST case
        run: >
          tools/run-eest-native.py
          --reader tools/test-utils/target/release/dump_to_batchinput
          --output "$RUNNER_TEMP/zisk-eest-native"
      - name: keep unexpected corpus failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eest-native-failures
          path: ${{ runner.temp }}/zisk-eest-native/failures
          if-no-files-found: ignore

  guest-elf-integrity:
    name: guest ELFs reproduce the recorded hashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Rebuild both guest ELFs from source in the pinned container and
      # compare each fresh sha256 to the recorded hash. This builds the ELFs
      # only; it does not prove, so it needs no GPU and no proving-key setup.
      # The job goes red whenever the source no longer matches the recorded
      # hash, which catches drift in the byte-frozen lib/, guest/ and
      # guest-aggregator/ trees.
      - name: rebuild the guest ELFs and compare to recorded hashes
        run: |
          ./build-guest.sh
          ./build-aggregator.sh
