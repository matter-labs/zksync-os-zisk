name: Docker build and release

# Builds the zksync-os-zisk-prover image and pushes it to ghcr + GAR, exactly like zksync-airbender-prover's stage-build.

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag of an image to build."
        type: string
        required: true
  push:
    branches:
      - main
    tags:
      - '[0-9]*'
  pull_request:
    paths:
      - 'docker/zksync-os-zisk-prover/**'
      - '.github/workflows/stage-build.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: 'bash -ex {0}'

permissions:
  packages: write
  contents: read

env:
  IMAGE_NAME: zksync-os-zisk-prover

jobs:
  build-image:
    name: Build and push zksync-os-zisk-prover
    runs-on: matterlabs-ci-runner-high-performance
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.tag_name || '' }}

      # Populates out/ for the Dockerfile; both scripts exit non-zero on a hash mismatch, failing the job before any image is built.
      - name: Build the guest ELFs in the pinned containers
        run: |
          ./build-guest.sh
          ./build-aggregator.sh

      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull-rate-limit relief only; the org credential has no push rights on Docker Hub (airbender pushes only to ghcr + GAR too).
      - name: Login to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Ambient runner identity, no stored key — the self-hosted runners carry GCP credentials.
      - name: Login to Google Artifact Registry
        run: gcloud auth configure-docker us-docker.pkg.dev -q

      - name: Compute SHA tag
        id: sha-tag
        run: echo "tag=${GITHUB_SHA::7}-$(date +%s%3N)" >> "${GITHUB_OUTPUT}"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            us-docker.pkg.dev/matterlabs-infra/matterlabs-docker/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag_name }},enable=${{ inputs.tag_name != '' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.sha-tag.outputs.tag }},enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=ref,event=pr

      - name: Define whether to save cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        id: set-cache-to
        run: echo "cache-to=type=registry,ref=ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}:buildcache,mode=max" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          build-args: |
            SCCACHE_GCS_BUCKET=matterlabs-infra-sccache-storage
            SCCACHE_GCS_SERVICE_ACCOUNT=gha-ci-runners@matterlabs-infra.iam.gserviceaccount.com
            SCCACHE_GCS_RW_MODE=READ_WRITE
            RUSTC_WRAPPER=sccache
          file: docker/zksync-os-zisk-prover/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: 'type=registry,ref=ghcr.io/${{ github.repository_owner }}/zksync-os-zisk-prover:buildcache'
          cache-to: ${{ steps.set-cache-to.outputs.cache-to }}
