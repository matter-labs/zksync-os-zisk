# Reusable workflow: generates SBOMs (Software Bill of Materials) for the
# source tree and for the ZiSK stack container image, then uploads them to
# Dependency Track for vulnerability and license tracking. Same shape as the
# airbender prover's workflow.
#
# An SBOM is a machine-readable inventory of every library and component in a
# software artifact (name, version, license, origin, known vulnerabilities at
# build time) in CycloneDX format. Keeping it current lets us detect newly
# disclosed CVEs in dependencies without rescanning, satisfy audits that
# require third-party component oversight, and answer supply-chain incidents
# by knowing which builds are affected. For these images it is also the
# record of what the ZiSK tarball brought in.
#
# Structure:
#   create-parent-project  ensures a collection project exists in DT that
#                          aggregates the child projects below.
#   sbom-code              scans the source tree with Syft and uploads
#                          "<repo>-code".
#   sbom-image             pulls the image from GHCR, scans it, and uploads
#                          "<repo>-image".
#
# Required repository configuration:
#   vars.DEPENDENCY_TRACK_SERVER_HOSTNAME, vars.DEPENDENCY_TRACK_PARENT_PROJECT_UUID,
#   secrets.DEPENDENCY_TRACK_API_KEY

name: SBOM generation and upload to Dependency Track

on:
  workflow_call:
    inputs:
      version:
        description: Version string to sync (a release tag or the sha tag)
        required: true
        type: string

jobs:
  create-parent-project:
    name: Create or verify Dependency Track collection project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Create or verify Dependency Track collection project
        shell: bash
        run: bash .github/scripts/create-dtrack-collection-project.sh
        env:
          DT_BASE_URL: https://${{ vars.DEPENDENCY_TRACK_SERVER_HOSTNAME }}
          DT_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          PROJECT_NAME: ${{ github.event.repository.name }}
          PROJECT_VERSION: ${{ inputs.version }}
          PARENT_UUID: ${{ vars.DEPENDENCY_TRACK_PARENT_PROJECT_UUID }}

  sbom-code:
    name: Generate and upload SBOM of the source code
    needs: create-parent-project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Generate CycloneDX file on code analysis
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          output-file: "bom-code.cdx.json"
          format: 'cyclonedx-json@1.6'
          upload-artifact: 'false'
          upload-release-assets: 'false'

      - name: Upload CycloneDX file to Dependency Track
        uses: DependencyTrack/gh-upload-sbom@b717d6595efa77a7ff1b18b57ac28597afc75d77 # v4.0.0
        with:
          serverhostname: ${{ vars.DEPENDENCY_TRACK_SERVER_HOSTNAME }}
          apikey: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          projectname: "${{ github.event.repository.name }}-code"
          projectversion: ${{ inputs.version }}
          isLatest: true
          bomfilename: "bom-code.cdx.json"
          autocreate: true
          parentname: ${{ github.event.repository.name }}
          parentversion: ${{ inputs.version }}

  sbom-image:
    name: Generate and upload SBOM of the container image
    needs: create-parent-project
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Generate CycloneDX file on image analysis
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/${{ github.repository_owner }}/zksync-os-zisk-prover:${{ inputs.version }}
          registry-username: ${{ github.repository_owner }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          output-file: "bom-image.cdx.json"
          format: 'cyclonedx-json@1.6'
          upload-artifact: 'false'
          upload-release-assets: 'false'

      - name: Upload CycloneDX file to Dependency Track
        uses: DependencyTrack/gh-upload-sbom@b717d6595efa77a7ff1b18b57ac28597afc75d77 # v4.0.0
        with:
          serverhostname: ${{ vars.DEPENDENCY_TRACK_SERVER_HOSTNAME }}
          apikey: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          projectname: "${{ github.event.repository.name }}-image"
          projectversion: ${{ inputs.version }}
          isLatest: true
          bomfilename: "bom-image.cdx.json"
          autocreate: true
          parentname: ${{ github.event.repository.name }}
          parentversion: ${{ inputs.version }}
