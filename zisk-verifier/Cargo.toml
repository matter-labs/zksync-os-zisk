[package]
name = "zisk-verifier"
version = "0.1.0"
edition = "2021"
description = "Off-chain verification helpers for ZKsync OS ZiSK proofs (server pre-submit checks)"
license = "MIT OR Apache-2.0"

# Keep the base crate dependency-light so the server can depend on it without
# pulling the whole prover stack. The base build needs only a SHA-256 backend
# and a 256-bit integer for the on-chain public-signal reduction.
[dependencies]
sha2 = { version = "0.10", default-features = false }
ruint = { version = "1", default-features = false }
# ZiSK's own verifier crate: the generated `vadcop_final` verifiers over
# pil2-proofman's `proofman-verifier`. Renamed because this crate shares its
# package name.
zisk-verifier-upstream = { package = "zisk-verifier", version = "=1.3.0-alpha", default-features = false, optional = true }
zksync-os-zisk-guest-aggregator = { path = "../guest-aggregator", optional = true }

[features]
default = []
# Enable the native (pure-Rust) vadcop_final STARK verifier via ZiSK's
# zisk-verifier crate. Off by default: it adds pil2-proofman's verifier and
# the aggregator parser. The base PLONK wire checks stay dependency-light
# without it.
stark-native = ["dep:zisk-verifier-upstream", "dep:zksync-os-zisk-guest-aggregator"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_vendor, values("zisk"))',
    'cfg(target_os, values("zkvm"))',
] }
