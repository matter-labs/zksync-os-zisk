# zisk-coordinator service configuration for the container image
# (docker/zisk-stack). Mounted or baked at /etc/zisk/coordinator.toml.
#
# Ports: 7000 is the client API the prover daemon calls, 50051 is the
# worker-facing cluster port, 9090 serves Prometheus metrics and GET /health.
# The compose file publishes 7000 and 9090 on loopback only; workers reach
# 50051 over the compose network.

[service]
name = "ZisK Coordinator"
environment = "production"

[server]
host = "0.0.0.0"
port = 7000
shutdown_timeout_seconds = 30

[metrics]
enabled = true
host = "0.0.0.0"
port = 9090

[logging]
level = "info"
format = "json"

[backend]
mode = "coordinator"

[coordinator]
port = 50051
# Tuning of the in-process coordinator core (timeouts, proof persistence).
config_file = "/etc/zisk/coordinator-core.toml"
